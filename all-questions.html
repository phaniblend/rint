  "a": "<span class='core'><b>The Core Rule:</b> The <code>^</code> prefix means 'this task depends on the same-named task in every package this package depends on' — omitting it makes a task depend only on that same task within its own package, silently skipping the requirement that a package's internal dependencies be built first.</span>If package A imports package B as a workspace dependency, and A's build task doesn't declare a dependency on B's build task completing first, the orchestrator may run them in parallel or in the wrong order — A ends up compiled against B's stale output, producing a build that succeeds locally but references outdated code. Declaring the dependency with the caret tells the orchestrator to walk the internal dependency graph and build every upstream workspace package first, in the correct topological order."
 },
 {
  "cat": "Monorepo Architecture",
  "q": "Internal packages in a workspace reference each other with a version specifier like <code>workspace:*</code> instead of a pinned semver range pointing at a published npm version. What does this buy during local development, and what has to happen differently at publish/release time?",
  "a": "<span class='core'><b>The Core Rule:</b> <code>workspace:*</code> means 'always resolve to the local copy in this monorepo, regardless of what's published' — it eliminates the 'I changed the shared package but forgot to publish and bump it' bug entirely during development, at the cost of needing an explicit rewrite step before anything is published externally.</span>During development, every consumer of an internal package sees its latest local source instantly, with no publish/bump/reinstall cycle needed to pick up a change — critical when iterating on a shared library used by several apps at once. But the specifier is meaningless outside the monorepo; the package manager's publish step has to rewrite it to a real, resolvable semver version before the package is published, or external installs will fail to resolve the dependency."
 },
 {
  "cat": "Monorepo Architecture",
  "q": "In a monorepo housing multiple independently-deployed apps and several shared packages, changing a widely-used shared package can force a redeploy of every app that depends on it, even ones with no other reason to ship that week. What are the two competing failure modes this tension creates, and how does a monorepo typically mitigate them?",
  "a": "<span class='core'><b>The Core Rule:</b> Coupling every app to the same shared package version trades 'apps can drift onto incompatible versions of shared code' for 'one shared-package change can force-cascade a redeploy across every consuming app' — the mitigation is making that cascade selective, rebuilding and redeploying only actually-affected apps, rather than all-or-nothing.</span>Without dependency-graph awareness, a shared package change could either be ignored by CI (apps silently drift onto stale shared code, reintroducing already-fixed bugs) or trigger a full rebuild-and-redeploy of every app regardless of whether it's actually affected. The fix is dependency-graph-aware CI: only rebuild, retest, and redeploy the specific apps whose dependency graph actually includes the changed package, using the same graph a caching build tool already computes for its own task pipeline."
 },
 {
  "cat": "Monorepo Architecture",
  "q": "A shared types/contracts package (e.g. generated API contract types) is imported by both a backend service and multiple frontend apps in the same monorepo, rather than each side maintaining its own hand-written copy of the same shapes. What class of production incident does this prevent that separate repos with independently-versioned type packages would not?",
  "a": "<span class='core'><b>The Core Rule:</b> When both sides of an API boundary import the exact same generated type definitions from one shared package, a breaking change to that contract fails the build of every affected consumer immediately, in the same PR that introduced it — across separate repos, that same change is only discovered at runtime, in whichever environment deploys the mismatched pair first.</span>If frontend and backend independently hand-maintain their own version of 'what does this API return,' they will eventually drift — a field renamed on one side and not the other compiles fine on both sides individually and fails only at runtime, often in production. A shared contracts package inside one monorepo means a backend change to the shape breaks the frontend's type-check in CI, before either side ships — turning a runtime incident into a compile-time PR review comment."
 },
 {
  "cat": "Micro-Frontend Architecture",
  "q": "A micro-frontend architecture can compose independently-owned apps either at build time (bundled together into one artifact) or at runtime (each deployed independently, stitched together in the browser or at the edge/CDN). What's the core tradeoff, and which failure mode does each avoid that the other doesn't?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Build-time integration gives one consistent, fully-optimized bundle at the cost of coupling every team's release cadence to a shared pipeline; runtime integration gives independent teams fully independent deploys at the cost of the composed page never being as tightly optimized, or as easy to reason about end-to-end, as a single build.</span>With build-time integration, you get one dependency graph the bundler can fully optimize and dedupe, but any team's change requires going through the same shared release pipeline, and one broken build blocks everyone. With runtime integration, each team ships on their own schedule with full deploy independence, but consistency — shared design tokens, a shared auth session, avoiding duplicate framework code loaded twice — has to be actively engineered rather than falling out of one shared build."
 },
 {
  "cat": "Micro-Frontend Architecture",
  "q": "Several independently-deployed micro-frontend apps each depend on a shared component/design-system library, but aren't necessarily all on the same version of it at the same time. What inconsistency does this create for the end user, and what are the two general strategies for managing it?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Allowing independently-deployed apps to sit on different versions of a shared design system trades a hard coordination requirement (every app upgrading in lockstep) for a real risk — the same conceptual component looking or behaving subtly differently depending on which micro-frontend the user is currently in, most glaring right at the seam between two apps.</span>If one app is on design-system v3 and a sibling app is still on v2, a user can see the same button, spacing, or interaction pattern render or behave differently depending on which micro-frontend they're viewing. The two general strategies: a strict, centrally-enforced version-bump SLA (every app must upgrade to a new major within N weeks, enforced by CI), or designing the seam so the user rarely perceives the two apps as one continuous surface, making version drift less visible even when it exists."
 },
 {
  "cat": "Micro-Frontend Architecture",
  "q": "In a system where several independently-deployed apps share one logical user session, where should session validation live — duplicated in each app, or centralized in one place all apps defer to? What breaks if each micro-frontend independently re-implements its own auth check?",
  "a": "<span class='core'><b>The Core Rule:</b> Session validation duplicated across N independently-deployed micro-frontends means N places that can silently drift out of sync with the actual auth provider's behavior — a shared gateway/edge layer, or a single shared auth library every app imports, keeps that logic centralized and consistently up to date.</span>If each micro-frontend hand-rolls its own token validation/refresh logic, a bug fix or security patch has to be found and independently reapplied in every app, and in practice some app will lag behind and carry the vulnerability longer than the others. Centralizing session validation — at a shared edge/gateway layer, or in one shared, versioned auth library — means a fix ships once and every consumer picks it up on their next dependency bump, the same 'shared package, not N copies' principle applied to security-sensitive code."
 },
 {
  "cat": "Micro-Frontend Architecture",
  "q": "Navigating from one micro-frontend to another typically requires a full page reload rather than a client-side transition, even though from the user's perspective it feels like 'the same website.' What UX cost does this impose, and what mitigations exist short of merging the apps into one codebase?",
  "a": "<span class='core'><b>The Core Rule:</b> A full page reload re-downloads and re-initializes an entire application — framework runtime, client-side caches — that a client-side transition within one app wouldn't; the mitigation isn't eliminating the reload, it's minimizing what has to be redone and hiding the visible cost of doing it.</span>The user sees a visible flash/loading state a same-app navigation wouldn't have, since everything from the framework runtime to client-side state has to be re-established from scratch (though a shared cookie-based session avoids re-authenticating). Mitigations include keeping the visual shell as similar as possible across apps so the reload feels less jarring, prefetching the target app's critical resources on hover/focus of a cross-app link, and — where the seam is hit often enough to matter — reconsidering whether it should actually be one app instead of two."
 },
 {
  "cat": "Micro-Frontend Architecture",
  "q": "If two independently-built micro-frontends both bundle their own full copy of the same framework, what's the actual cost to the end user, and why is deduplicating that runtime across independently-deployed apps a genuinely hard problem rather than a simple config flag?",
  "a": "<span class='core'><b>The Core Rule:</b> Framework code duplicated across independently-built bundles means the browser downloads, parses, and executes the same runtime multiple times in one session — deduplicating it requires the independently-deployed apps to agree, at runtime, on a shared version and loading strategy, which reintroduces exactly the cross-team coordination micro-frontends were adopted to avoid.</span>Each micro-frontend, built and deployed independently, typically has no visibility into what framework version a sibling app bundled, so naively every app ships its own copy, and a session touching three different micro-frontends downloads the framework three times. Sharing a single runtime instance requires every app to agree on a compatible version and loading mechanism — the kind of tight coupling between independently-deployed teams that micro-frontends are usually adopted specifically to avoid, so it's a real tradeoff, not a free win."
 },
 {
  "cat": "Rendering Strategies: SSR, SSG, CSR & Streaming",
  "q": "For a given page, when is client-side rendering (CSR) the right choice over server-side rendering (SSR) or static generation (SSG), given that SSR/SSG generally produce faster perceived load and better SEO?",
  "a": "<span class='core'><b>The Core Rule:</b> Choose based on how personalized the content is and how often it changes — content identical for every visitor and rarely changing is a great SSG candidate; content personalized per-request but still benefiting from a fast first paint is SSR; content that's highly interactive, rarely needs indexing, and is gated behind auth anyway is often fine as CSR.</span>SSG produces the fastest possible response — a pre-built static file, no server compute per request — but is wrong for anything personalized per user, since the same HTML is served to everyone. SSR computes a personalized response per request at the cost of server compute time on every hit. CSR defers everything to the client, the right tradeoff for a highly interactive, already-authenticated app where SEO doesn't matter and the user will wait through one loading state before a dynamic experience takes over — forcing that same page through SSR would spend server compute rendering a shell nobody unauthenticated will ever see indexed."
 },
 {
  "cat": "Rendering Strategies: SSR, SSG, CSR & Streaming",
  "q": "A server-rendered page's initial HTML doesn't exactly match what the client-side render produces on hydration — say, the server rendered a date in UTC and the client reformats it in the user's local timezone on mount. What goes wrong mechanically, and why doesn't React just quietly accept the client's version?",
  "a": "<span class='core'><b>The Core Rule:</b> Hydration isn't a fresh render — it's React attaching event handlers and internal fiber state to DOM nodes it assumes already match what it would have rendered; when that assumption is wrong, React has to choose between trusting DOM it can't verify or discarding and re-rendering, and by default it warns loudly and falls back to the client's render, which can cause a visible content flash.</span>Hydration skips re-creating DOM nodes the server already produced, assuming a client render of the same tree with the same data produces the same output — it doesn't diff against the server HTML first. When server and client output differ (timezone-dependent formatting, non-deterministic values), React detects the mismatch, warns, and re-renders the affected subtree from the client — visible as content changing right after load. The fix is always making the value deterministic (compute it only after mount, showing a server-safe placeholder first), not suppressing the warning."
 },
 {
  "cat": "Rendering Strategies: SSR, SSG, CSR & Streaming",
  "q": "Streaming SSR renders and flushes different parts of a page to the client at different times as each part's data becomes ready, rather than waiting for the entire page's data before sending any HTML. What does this trade away compared to a single fully-rendered response, and why is it usually still the better default for pages with slow, independent data dependencies?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Streaming trades response simplicity — one complete document, one status code, decided once — for time-to-first-byte and progressive rendering; the server commits to a 200 and a shell before it knows whether every slice of the page will actually succeed, which changes how error handling has to work.</span>A single fully-rendered response can compute a definitive HTTP status before sending anything; streaming can't, because by the time a later chunk fails, the 200 status and earlier HTML have already gone out — failures in later chunks have to be handled client-side rather than as a server-level HTTP error. In exchange, users see the shell and any fast-resolving content immediately instead of waiting for the single slowest dependency to block everything — the right default whenever a page combines fast, universally-needed content with slower, optional content that shouldn't hold up the former."
 },
 {
  "cat": "Rendering Strategies: SSR, SSG, CSR & Streaming",
  "q": "A page's content changes periodically but not on every request, so pure SSR (recomputing on every hit) is wasteful, while pure SSG (built once) would show stale data indefinitely. What middle-ground rendering strategy addresses this, and what risk does a naive implementation introduce?",
  "a": "<span class='core'><b>The Core Rule:</b> Incremental/stale-while-revalidate strategies serve a cached response immediately while triggering a background regeneration for the next request — the risk is that the response the user just got can be arbitrarily stale, up to the revalidation window, which is fine for a blog post and potentially dangerous for anything security- or pricing-sensitive.</span>Rather than recomputing every request or building once and never updating, this middle ground serves the last-generated cached version immediately and kicks off a background regeneration so the next request gets fresh content — the current one never waits on it. The risk is real staleness within that window: harmless for content where a few minutes of lag doesn't matter, dangerous if applied to something like a price or inventory count where showing stale data could mean honoring an incorrect price."
 },
 {
  "cat": "Rendering Strategies: SSR, SSG, CSR & Streaming",
  "q": "Server-rendering a request at an edge location physically close to the user, versus at a single centralized origin server, both produce the same HTML — so what latency mechanism does edge rendering actually improve, and what constraint does it impose on what that render can do?",
  "a": "<span class='core'><b>The Core Rule:</b> Edge rendering shortens the network round-trip to the compute doing the rendering, not the rendering work itself — the tradeoff is that edge runtimes are typically more constrained than a full origin server, so not every rendering workload can run there unmodified.</span>If a user has to round-trip to a single distant origin server before any HTML comes back, that round-trip latency is pure overhead regardless of how fast the rendering itself is — running the same render near the user removes most of that latency. The catch is edge runtimes usually aren't full Node.js: a more restricted JS runtime with stricter time/memory budgets and missing APIs a full server would have, so code doing anything heavy may need adapting or has to stay at the origin instead."
 },
 {
  "cat": "Edge Computing & Edge Workers",
  "q": "An app runs a lightweight auth/redirect check in edge middleware before a request ever reaches the main server-rendering compute, rather than doing that check inside the page's own loader. What latency/cost benefit does this get, and what has to be true about the check for it to be safe to run at the edge?",
  "a": "<span class='core'><b>The Core Rule:</b> Running a cheap reject-or-pass check at the edge means an unauthenticated request never pays for spinning up full SSR just to be redirected — but the check has to be doable with only what's available at the edge, typically just the request's own headers/cookies, since edge runtimes are optimized for fast, stateless decisions, not heavy compute.</span>If the auth check only happens deep inside a page's SSR loader, the system has already paid the cost of routing to origin, spinning up rendering, and getting partway through a loader before discovering the request should be rejected. A cheap presence/validity check at the edge lets you redirect immediately, but usually can't afford a database lookup — it can verify 'is there a plausibly-valid session cookie present' but generally can't check 'is this specific session still valid in our session store' without adding a round-trip that defeats the edge's latency benefit."
 },
 {
  "cat": "Edge Computing & Edge Workers",
  "q": "A function that runs fine in a normal Node.js server environment fails or has to be rewritten when deployed to an edge runtime. What categories of Node.js behavior are commonly unavailable at the edge, and why do edge platforms accept that limitation instead of just running full Node.js everywhere?",
  "a": "<span class='core'><b>The Core Rule:</b> Edge runtimes trade full Node.js compatibility for a much smaller, faster-starting execution environment deployable to hundreds of physical locations cheaply — the categories that break are usually native Node modules, filesystem access, and long-running synchronous compute, none of which fit a runtime optimized for many small, fast, geographically-distributed instances.</span>A full Node.js runtime is relatively heavy to start and keep running in hundreds of locations simultaneously, so edge platforms use a stripped-down JS runtime that starts near-instantly but lacks native Node modules, meaningful filesystem access, and tolerance for long-running or CPU-heavy synchronous work. Code depending on any of those has to be rewritten with edge-compatible equivalents or kept running at the origin."
 },
 {
  "cat": "Edge Computing & Edge Workers",
  "q": "A response is cached at edge/CDN locations close to users to avoid recomputing it on every request, but the underlying data can change. What's the fundamental tension this creates, and what's the difference between time-based expiry and event-driven invalidation as ways to resolve it?",
  "a": "<span class='core'><b>The Core Rule:</b> Every caching strategy is a bet about how long stale data is acceptable — time-based expiry bets on a fixed window and accepts staleness up to that window for simplicity; event-driven invalidation actively purges cached entries the moment underlying data changes, at the cost of needing every data-mutating code path to remember to trigger that purge.</span>The tension: caching exists to avoid recomputing on every request, but the moment underlying data changes, every cached copy at every edge location is now serving something outdated. Time-based expiry is simple and needs no coordination with mutating code but guarantees a staleness window by design. Event-driven invalidation eliminates that window by having the mutation trigger a purge across all edge locations — more precise, but only as reliable as every mutation path remembering to fire it, and it requires the caching layer to expose a purge API."
 },
 {
  "cat": "Edge Computing & Edge Workers",
  "q": "A serverless function at the origin can experience a 'cold start' — a noticeable delay on the first request after a period of inactivity while the platform provisions a fresh environment. Why are edge functions typically less prone to this, and what does that difference cost in terms of what an edge function is allowed to do?",
  "a": "<span class='core'><b>The Core Rule:</b> A smaller, more constrained runtime is faster to spin up from cold — edge functions minimize cold-start latency by giving up things that make a runtime slower to initialize (heavier language runtimes, large dependency trees, persistent connections), the same tradeoff that limits what they can do once running.</span>A full serverless origin function often runs a heavier runtime that takes real time to initialize from a cold, unprovisioned state — noticeable latency on the first request after scaling to zero. Edge runtimes are deliberately lightweight, closer to a JS isolate than a full process, specifically so they spin up in single-digit milliseconds — but that lightness restricts what they can do: no heavy native dependencies, no long-lived stateful connections held open between requests."
 },
 {
  "cat": "Edge Computing & Edge Workers",
  "q": "A team considers moving per-request logic (like A/B test bucket assignment) from the origin server into an edge function, rather than relying on plain CDN caching of a static asset. What's the actual distinction between 'edge compute' and 'CDN caching,' since both happen at the same physical locations?",
  "a": "<span class='core'><b>The Core Rule:</b> CDN caching serves an already-computed, identical response to everyone who hits a cache key; edge compute runs actual per-request logic at that same physical location before responding — the distinction is between physically-close storage of a static result versus physically-close execution of dynamic code.</span>Plain CDN caching is a key-value lookup: a request maps to a cache key, and on a hit, the exact same bytes serve every requester with that key, with no per-request computation at the edge at all. Edge compute means actual code executes at that location for every request, producing a response that can differ per request even though it's still served close to the user. Moving A/B bucket assignment to the edge means every user gets a personalized decision computed close to them, without falling back to origin compute — something CDN caching alone couldn't do without either bypassing the cache or baking every variant into separate cache keys."
 },
 {
  "cat": "Performance Engineering",
  "q": "An app wraps its route components in <code>React.lazy()</code> with dynamic <code>import()</code>, splitting the bundle so each route's code downloads only when the user navigates there, rather than shipping one large bundle up front. What's the actual mechanism that makes this work, and what UX problem does it introduce that a single bundle didn't have?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Code splitting trades a large, single, blocking initial download for many small, on-demand downloads that trigger exactly when needed — the tradeoff is that navigating to a not-yet-downloaded route now has a network dependency it didn't have before, which is why every lazy boundary needs a Suspense fallback.</span>Dynamic <code>import()</code> tells the bundler to emit that module as a separate chunk, fetched only when the <code>import()</code> call actually executes — for a route-level lazy component, that's the moment the user navigates there, so the first page load only pays for the code it actually needs. The cost: navigating to a route the user hasn't visited yet now waits on a network request for that chunk, which is why every <code>React.lazy()</code> boundary needs a <code>Suspense</code> fallback — without one, that navigation would have no loading state while the chunk downloads."
 },
 {
  "cat": "Performance Engineering",
  "q": "A junior engineer wraps nearly every value and function in a component with <code>useMemo</code>/<code>useCallback</code>, reasoning that memoization can only help performance. What's wrong with that reasoning, and under what specific condition does memoization start paying for itself instead of costing more than it saves?",
  "a": "<span class='core'><b>The Core Rule:</b> Memoization isn't free — it costs a dependency-array comparison on every render and holds the previous value in memory; it only pays off when the memoized thing is expensive to recompute or its stable identity is genuinely required downstream (as a dependency of another hook, or a prop to a memoized child) — otherwise you're paying comparison cost for a value that was cheap anyway.</span>For a trivial computation, wrapping it in <code>useMemo</code> adds the overhead of storing previous dependencies and comparing them every render, skipping work that was already nearly free — a net loss. Memoization earns its cost in exactly two situations: the computation is genuinely expensive, so skipping it on unchanged inputs is a real win, or a stable reference is structurally required by a memoized child or another hook's dependency array. Applying it everywhere 'just in case' adds constant overhead to every render for a benefit that, in the common case, isn't there."
 },
 {
  "cat": "Performance Engineering",
  "q": "A list rendering thousands of DOM nodes is replaced with a windowed/virtualized version that only renders items currently visible in the viewport, recycling DOM nodes as the user scrolls. What specific browser cost does this eliminate, and what does virtualization break that a normal list didn't?",
  "a": "<span class='core'><b>The Core Rule:</b> A long list's real cost isn't React's render function running many times — it's the browser having to create, lay out, and paint thousands of real DOM nodes, most invisible; virtualization eliminates that by keeping a small, constant number of DOM nodes, repositioned to simulate scrolling through a much larger list — at the cost of breaking things that assume every item has a persistent DOM node, like browser find-in-page.</span>Rendering ten thousand items as real DOM nodes means the browser allocates, lays out, and paints all ten thousand even though only twenty are ever visible at once. Virtualization keeps a constant, small number of actual nodes, reusing and repositioning them as the user scrolls — turning an O(n) DOM cost into O(1) regardless of list length. The tradeoff: browser find-in-page, deep-linking by scrolling to an anchor, and certain accessibility tools have to be specifically re-implemented or accepted as limitations, since most of the list literally doesn't exist in the DOM at any given moment."
 },
 {
  "cat": "Performance Engineering",
  "q": "An app manages server data with a normalized, cache-aware data-fetching layer (like RTK Query or React Query) rather than each component independently calling fetch and storing the result in its own useState. What specific problems does a shared, normalized cache solve that independent per-component fetching creates?",
  "a": "<span class='core'><b>The Core Rule:</b> Independent per-component fetching means the same server data can be fetched redundantly by every component that needs it, and once fetched, each component's local copy can silently drift out of sync with every other component's copy of 'the same' data — a normalized shared cache fixes both by making 'the same entity' actually be the same object everywhere it's displayed.</span>If two components both independently fetch the same resource into local state, you get duplicate network requests, and — worse — if one later updates that resource, the other's stale copy has no way to find out, showing outdated data until it happens to refetch on its own. A shared, normalized cache keyed by entity type and id means every component reading a given entity reads from the same cache entry; a mutation updates that one entry, and every subscribed component re-renders with the fresh value automatically, with no manual coordination."
 },
 {
  "cat": "Performance Engineering",
  "q": "A component reads from a Redux store using a selector that returns a brand-new array or object literal on every call (e.g. <code>state => state.items.filter(...)</code>), rather than a memoized selector. Why does this cause the component to re-render even when the actual underlying data hasn't meaningfully changed?",
  "a": "<span class='core'><b>The Core Rule:</b> <code>useSelector</code> decides whether to re-render by comparing the selector's previous return value to its new one with reference equality — a selector computing a fresh array/object literal every call produces a new reference every time regardless of whether the underlying data changed, so every store update looks like a change even when it isn't.</span>A selector running <code>.filter()</code> fresh on every invocation produces a brand-new array reference each time, even if the source data and predicate result are identical to last time — <code>useSelector</code>'s default equality check sees two different references and triggers a re-render that didn't need to happen. A memoized selector (built with something like reselect's <code>createSelector</code>) caches its result and only recomputes when its actual input dependencies change by reference, so an unchanged input returns the exact same output reference as before, and the equality check correctly concludes nothing changed."
 },
 {
  "cat": "Performance Engineering",
  "q": "A team optimizes for Largest Contentful Paint (LCP) by inlining critical CSS and preloading the hero image, for Cumulative Layout Shift (CLS) by reserving space for images before they load, and for Interaction to Next Paint (INP) by breaking up long JavaScript tasks. What does each of these three metrics actually measure, and why does optimizing one not necessarily improve the others?",
  "a": "<span class='core'><b>The Core Rule:</b> The three Core Web Vitals measure genuinely different aspects of user experience — how fast the main content appears (LCP), how visually stable the page is while loading (CLS), and how responsive it feels to interaction after loading (INP) — a fix for one can actively hurt another, so they have to be optimized as a set, not independently.</span>LCP measures how long the largest visible element takes to render, dominated by network latency and render-blocking resources. CLS measures how much visible content unexpectedly shifts as the page continues loading, dominated by late-arriving content that doesn't reserve layout space up front. INP measures how quickly the page responds after an interaction, dominated by long-running JavaScript blocking the main thread. Because they measure different phases, inlining more CSS to help LCP can add main-thread parsing work that delays interactivity and hurts INP — real optimization work has to budget across all three rather than chasing one in isolation."
 },

const cats = [...new Set(DATA.map(d => d.cat))];
let activeCat = "all";
let query = "";

const main = document.getElementById("main");
const controls = document.querySelector(".controls");
const searchInput = document.getElementById("search");
const statsEl = document.getElementById("stats");

cats.forEach(c => {
  const pill = document.createElement("span");
  pill.className = "pill";
  pill.dataset.cat = c;
  pill.textContent = c;
  controls.appendChild(pill);
});

function render(){
  main.innerHTML = "";
  const q = query.trim().toLowerCase();
  let shown = 0;
  let currentCat = null;
  let catCounts = {};

  const filtered = DATA.filter(d => {
    const catOk = activeCat === "all" || d.cat === activeCat;
    const text = (d.q + " " + d.a).toLowerCase();
    const qOk = !q || text.includes(q);
    return catOk && qOk;
  });

  filtered.forEach(d => { catCounts[d.cat] = (catCounts[d.cat]||0)+1; });

  if (filtered.length === 0){
    main.innerHTML = '<div class="empty">No questions match. Try a different search or category.</div>';
  }

  filtered.forEach((d) => {
    if (d.cat !== currentCat){
      currentCat = d.cat;
      const h = document.createElement("div");
      h.className = "cat-heading";
      h.innerHTML = `${d.cat} <span class="cat-count">${catCounts[d.cat]}</span>`;
      main.appendChild(h);
    }
    shown++;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="q">
        <span class="q-num">Q${DATA.indexOf(d)+1}</span>
        <span class="q-text">${d.q}</span>
        <span class="chevron">▶</span>
      </div>
      <div class="a-wrap"><div class="a">${d.a}</div></div>
    `;
    card.querySelector(".q").addEventListener("click", () => card.classList.toggle("open"));
    main.appendChild(card);
  });

  statsEl.textContent = `Showing ${shown} of ${DATA.length} questions across ${cats.length} categories.`;
}

document.querySelectorAll(".pill").forEach(p => {
  p.addEventListener("click", () => {
    document.querySelectorAll(".pill").forEach(x => x.classList.remove("active"));
    p.classList.add("active");
    activeCat = p.dataset.cat;
    render();
  });
});

searchInput.addEventListener("input", e => {
  query = e.target.value;
  render();
});

render();
</script>
