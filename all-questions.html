<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interview Prep — All Questions</title>
<style>
  :root{
    --bg:#0f1419; --panel:#161c24; --panel2:#1c232d; --border:#2a323d;
    --text:#e6edf3; --muted:#9aa7b5; --accent:#5fb3ff; --accent2:#7ee0b8;
    --tag-bg:#1e2937; --code:#ffcb6b; --core:#ffd479;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height:1.55;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg, var(--bg) 80%, transparent);
    padding:28px 24px 14px;
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
  }
  h1{ margin:0 0 4px; font-size:1.5rem; letter-spacing:-0.01em; }
  .subtitle{ color:var(--muted); font-size:.92rem; margin-bottom:16px; }
  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  #search{
    flex:1 1 240px; min-width:200px; background:var(--panel2); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:9px 12px; font-size:.9rem; outline:none;
  }
  #search:focus{ border-color:var(--accent); }
  .pill{
    cursor:pointer; user-select:none; border:1px solid var(--border); background:var(--tag-bg);
    color:var(--muted); border-radius:999px; padding:6px 13px; font-size:.8rem; white-space:nowrap;
    transition: all .15s;
  }
  .pill:hover{ color:var(--text); border-color:var(--accent); }
  .pill.active{ background:var(--accent); color:#08131f; border-color:var(--accent); font-weight:600; }
  .stats{ color:var(--muted); font-size:.78rem; margin-top:10px; }
  main{ max-width:900px; margin:0 auto; padding:20px 24px 80px; }
  .cat-heading{
    margin:38px 0 14px; padding-top:6px; font-size:1.05rem; color:var(--accent2);
    border-top:1px solid var(--border); display:flex; align-items:center; gap:10px;
  }
  .cat-heading:first-of-type{ border-top:none; margin-top:8px; }
  .cat-count{ font-size:.72rem; color:var(--muted); font-weight:400; background:var(--tag-bg); padding:2px 8px; border-radius:999px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .q{
    padding:16px 18px; cursor:pointer; display:flex; gap:12px; align-items:flex-start;
    transition: background .12s;
  }
  .q:hover{ background:var(--panel2); }
  .q-num{ color:var(--accent); font-weight:700; font-size:.85rem; flex-shrink:0; padding-top:1px; }
  .q-text{ font-size:.95rem; font-weight:500; }
  .q-text code{ background:#0b0f14; color:var(--code); padding:1px 5px; border-radius:4px; font-size:.85em; }
  .chevron{ margin-left:auto; color:var(--muted); flex-shrink:0; transition: transform .15s; font-size:.8rem; }
  .card.open .chevron{ transform: rotate(90deg); }
  .a-wrap{ max-height:0; overflow:hidden; transition: max-height .25s ease; }
  .card.open .a-wrap{ max-height:2600px; }
  .a{
    padding:0 18px 18px 42px; font-size:.9rem; color:#cfd8e3;
  }
  .a code{ background:#0b0f14; color:var(--code); padding:1px 5px; border-radius:4px; font-size:.85em; }
  .core{
    display:block; margin:0 0 10px; padding:10px 12px; background:#241d0e;
    border-left:3px solid var(--core); border-radius:6px; color:#ffe9b3; font-size:.88rem;
  }
  .core b{ color:var(--core); }
  .hidden{ display:none !important; }
  .empty{ text-align:center; color:var(--muted); padding:60px 0; font-size:.95rem; }
  @media print{
    header{ position:static; }
    .a-wrap{ max-height:none !important; }
    .chevron{ display:none; }
    .controls{ display:none; }
  }
  .q-ctx{ margin-top:6px; font-size:.82rem; font-weight:400; color:var(--muted); }
  .ml{ margin:0 0 6px; }
  .ml.highlight{ color:#ffe9b3; background:#241d0e; border-left:3px solid var(--core); border-radius:6px; padding:6px 10px; }
  .ml.yes{ color:var(--accent2); } .ml.no{ color:#ff8a80; }
  .a pre{ margin:8px 0; padding:10px 12px; background:#0b0f14; border:1px solid var(--border); border-radius:6px; overflow-x:auto; }
  .a pre code{ background:none; padding:0; color:var(--code); font-size:.82rem; }
</style>
</head>
<body>

<header>
  <h1>🧠 Interview Prep — All Questions</h1>
  <div class="subtitle">164 questions in one place: 87 senior React/TypeScript architecture questions, 50 JavaScript deep-dive flashcards, and 27 JS engine memory cards (this, scope &amp; closures, hoisting). Search across all of them or filter by category.</div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search questions or answers…" />
    <span class="pill active" data-cat="all">All</span>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main id="main"></main>

<script>
const DATA = [
 {
  "cat": "React State, Effects & Refs",
  "q": "A component needs to re-render every time a piece of live data changes, so the user always sees the latest value instead of a stale snapshot. What is <code>useState</code> actually doing under the hood that makes this possible — and why can't a plain outer-scope variable do the same job?",
  "a": "<span class='core'><b>The Core Rule:</b> React only re-renders a component when something marks its fiber dirty — and the only things that do that are a state update or a parent re-render. A variable mutated outside that mechanism is invisible to React, no matter how often it changes.</span>A plain module- or closure-scoped variable mutated directly never invalidates the fiber tree, so React has no signal to re-render — the DOM keeps showing whatever was true at the last render. Calling <code>setState</code> marks the component's fiber dirty, React batches the update, diffs the new output against what's committed, and patches only the changed DOM nodes. So <code>useState</code> isn't 'a way to store a variable' — it's the subscription mechanism that makes a component reactive to a data source over time. Anything that must survive across renders <i>and</i> cause a redraw when it changes belongs in state; anything that must survive renders <i>without</i> causing one belongs in a ref."
 },
 {
  "cat": "React State, Effects & Refs",
  "q": "A component initializes state with <code>useState(() => expensiveValue)</code> instead of <code>useState(expensiveValue)</code>. Why does the callback form matter, even when the value is derived from props that won't change across re-renders?",
  "a": "<span class='core'><b>The Core Rule:</b> The callback form is React's lazy initializer — it runs exactly once, on mount, and never again. The plain-value form re-evaluates on every render, even though React discards the result after the first one.</span>For a cheap value the waste is negligible, but it's a correctness-and-intent habit: if the initializer is expensive, or could throw on a value that isn't safe to read on every render, lazy init guarantees it runs exactly once, only when needed. It also documents intent — 'this seeds uncontrolled internal state, it isn't meant to re-sync with the prop' — as opposed to a <code>useEffect</code> that intentionally syncs state to a changing prop after mount."
 },
 {
  "cat": "React State, Effects & Refs",
  "q": "An effect kicks off an async operation (like initializing a third-party SDK), sets a local <code>isCurrent = true</code> flag, flips it to <code>false</code> in the cleanup function, and checks it before calling <code>setState</code> in the resolved callback. Isn't returning a cleanup function from <code>useEffect</code> enough on its own to prevent a stale update?",
  "a": "<span class='core'><b>The Core Rule:</b> Cleanup cancels the effect, not the promise. An in-flight async operation keeps running regardless of whether the component (or that specific effect run) is still current.</span>Without the flag, if the component unmounts — or a dependency changes, re-triggering the effect — before the promise resolves, the stale <code>.then()</code> callback still fires and calls <code>setState</code> on a defunct closure: a 'no-op on unmounted component' warning at best, corrupted state from a stale run at worst. Because the flag is captured fresh per effect invocation, cleanup correctly invalidates only that specific run's callback — the same job an <code>AbortController</code> does for fetches, applied to an arbitrary async operation with no built-in cancellation."
 },
 {
  "cat": "React State, Effects & Refs",
  "q": "If a React component relies on four separate <code>useRef</code> hooks — for example tracking previous stream state, a deduplication set of already-seen items, and a set of recently-mutated item ids — instead of <code>useState</code>, what architectural trade-off is being made each time?",
  "a": "<span class='core'><b>The Core Architectural Trade-off:</b> The decision comes down to two questions — does the render output depend on this value, and do updates need synchronous, read-after-write visibility across callbacks that can fire before React re-renders?</span>Each of these values must persist across renders but must never itself trigger one, and reads/writes must be synchronous rather than batched. A deduplication set mutated inside an async-resolution handler needs the <i>current</i> value the instant a sibling callback fires — as state, the update would be batched/async, and two callbacks landing in the same tick could both read the pre-update set and duplicate work. A ref sidesteps the render machinery entirely, acting like instance memory on a class component. Reaching for four of them in one component usually means it's coordinating multiple independently-resolving async sources and needs bookkeeping that render-triggering state would make racy."
 },
 {
  "cat": "React State, Effects & Refs",
  "q": "A state updater is written as <code>setItems(prev => [...prev, newItem])</code> instead of <code>setItems([...items, newItem])</code>, inside a callback invoked from multiple independently-resolving async sources firing in quick succession. Why does the functional form matter specifically here?",
  "a": "<span class='core'><b>The Core Rule:</b> Whenever new state is derived from old state and more than one update can be in flight concurrently, use the functional updater — reading a captured variable directly is a race condition waiting to happen.</span>If several async callbacks are each invoked from a closure that captured a different snapshot of <code>items</code>, reading <code>items</code> directly risks a lost-update race: two callbacks firing before React re-renders would each overwrite the other's addition, silently dropping an item. The functional form defers to whatever state <i>actually</i> is at the moment React applies the update, so all queued updates compose correctly no matter how stale the closure that scheduled them was."
 },
 {
  "cat": "React State, Effects & Refs",
  "q": "A component tracks a numeric 'version' counter in a ref, stamps every async operation it kicks off with the version active at the time, and checks that stamp before applying the result. What problem does this solve that a plain boolean 'is this component still mounted' flag does not?",
  "a": "<span class='core'><b>The Core Rule:</b> An is-mounted flag answers 'is the component alive?' A version counter answers 'is this result from the current generation of work?' — different questions whenever a component's async source can change without the component unmounting.</span>If a component stays mounted across a prop change that restarts its underlying async work (say, switching which entity it's displaying), a promise from the <i>previous</i> generation of work that resolves late would still pass an is-mounted check and stomp on state meant to reflect the new generation. The version counter closes that gap — the correct invalidation unit whenever a component's async source is swapped mid-lifecycle rather than torn down, the same problem libraries like React Query solve internally with query keys."
 },
 {
  "cat": "React Rendering & Component Patterns",
  "q": "A data-loading function returns several promises un-awaited, and the UI wraps each one in its own <code>&lt;Suspense&gt;&lt;Await&gt;</code> boundary instead of the loader awaiting everything up front. What would page performance look like if the loader awaited every promise before returning?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Awaiting everything turns N independent, differently-latent calls into one synchronous barrier gated by the slowest one; returning promises unresolved lets each UI region unblock the instant its own data is ready.</span>The whole page, shell included, would block on the slowest upstream call — a flaky endpoint holding up data that was ready in milliseconds elsewhere on the same page. Returning promises un-awaited lets the framework stream the shell immediately, and each Suspense boundary independently unblocks and paints the moment its own promise settles, converting a worst-case aggregate latency into a per-region latency."
 },
 {
  "cat": "React Rendering & Component Patterns",
  "q": "A component is rendered with a <code>key</code> derived from an identity value (like a selected entity's id), even though it already has effect-based logic that resets its own internal state whenever that value changes as a prop. Why key on it too, given the reset logic already exists?",
  "a": "<span class='core'><b>The Core Rule:</b> Changing <code>key</code> is the nuclear option for state reset — it discards the entire fiber, including every ref, regardless of whether any manually-written reset logic actually covers every piece of internal state.</span>Effect-based resets react to whatever's in their dependency array, but a full remount discards <i>every</i> ref and piece of internal state unconditionally and instantly, with zero risk of a subtle bug in the reset effect leaving something stale. It trades an acceptable unmount/remount cost for eliminating a whole class of 'did I reset every piece of local state' bugs — the standard move whenever a subtree's state should be scoped entirely to an identity like a selected entity or route param."
 },
 {
  "cat": "React Rendering & Component Patterns",
  "q": "A delete/stop action removes an item from local UI state immediately, triggers a server revalidation, and also records the item's id in a ref so a late-resolving async source won't re-add it. Why are all three mechanisms needed instead of just triggering revalidation?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Optimistic UI gives instant feedback while the authoritative refetch is in flight, but that creates a reconciliation problem once more than one data source can independently produce the same entity — you need a way to say 'this one is intentionally hidden' until every source agrees.</span>Revalidation refetches from the true source of record, but that round-trip has latency during which the UI would still show the removed item without the optimistic update. The item list can also be fed by original in-flight async sources that were already resolving when the action happened — one of which can resolve <i>after</i> the optimistic removal but <i>before</i> revalidation completes, re-inserting the just-removed item. The tracking ref closes that gap by letting the resolution handler recognize 'this item is being optimistically hidden' and route it accordingly."
 },
 {
  "cat": "React Rendering & Component Patterns",
  "q": "A mutation (like deleting an item) is triggered via a framework's non-navigating submission primitive (e.g. React Router's <code>useFetcher</code>) instead of a full form submission or a raw <code>fetch()</code> call. What does that primitive give you over either alternative?",
  "a": "<span class='core'><b>The Core Trade-off:</b> A full-navigation form submission carries page-transition semantics you don't want for an in-place mutation; a raw fetch gives full control but zero built-in state tracking. A non-navigating fetcher sits in between — same server-side handler, no navigation side effects, built-in pending state.</span>A full-page form submission triggers navigation semantics — re-running loaders and potentially touching URL/scroll state — wrong for an in-place action. A raw <code>fetch()</code> works but hands you nothing for free: you'd hand-roll pending-state tracking and manually trigger a refetch afterward. A non-navigating fetcher gives an isolated submission with its own <code>state</code>/<code>data</code>, without touching the router's global navigation state, while still running through the same server-side handler as a real form post."
 },
 {
  "cat": "React Rendering & Component Patterns",
  "q": "A single server-side mutation handler branches on an <code>intent</code> field to handle several different mutations for one page, rather than giving each mutation its own dedicated endpoint. What's the architectural trade-off of this pattern?",
  "a": "<span class='core'><b>The Core Trade-off:</b> One handler per page keeps everything that can mutate that page's data in one place, at the cost of losing per-mutation type safety and endpoint-level separation of concerns as the number of intents grows.</span>Colocating intents avoids a dedicated endpoint per RPC-style call. The cost: the handler loses per-intent type safety (form/body data is usually stringly-typed, so every intent needs its own manual validation guard) and accumulates branches as intents grow. Past three or four intents, or once they need materially different auth/validation, splitting into dedicated endpoints trades a little routing overhead for real type boundaries and cleaner tests."
 },
 {
  "cat": "React Rendering & Component Patterns",
  "q": "A UI library exposes compound components — e.g. <code>Table.Root/Header/Column/Body</code>, <code>Select.Root/Button/Popover</code> — instead of single components taking one large configuration prop. What does the compound-component pattern buy architecturally, and what's the cost?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Compound components trade configurability-from-external-data for composability-in-JSX — HTML-like expressiveness at the cost of being unable to drive the structure from a plain data/config object.</span>Compound components share implicit state through context internally, so a consumer composes exactly the pieces it needs in whatever nesting fits the layout. The cost is discoverability and rigidity: consumers must know the compound API's shape and can't easily drive it from arbitrary external data — you can't serialize a compound tree into JSON-driven config the way a props-driven component allows, so it's the wrong tool when structure must be built dynamically with no known slots."
 },
 {
  "cat": "React Rendering & Component Patterns",
  "q": "A component accepts a prop typed as <code>T | T[]</code> and immediately normalizes it into an array as its first line of logic. Why accept a union at the API boundary instead of just requiring callers to always pass an array?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Accepting a union at the boundary optimizes the common single-item call site at the cost of a little internal normalization — worth it only when the single and array cases carry no different semantic meaning.</span>Most callers likely need exactly one item, and forcing every caller to wrap it in an array for the common case is needless ceremony that also invites a bug (forgetting the wrapper). Accepting the union puts the small normalization cost in exactly one place instead of scattering array-wrapping across every call site — the same tradeoff library APIs make with props like <code>className?: string | string[]</code>."
 },
 {
  "cat": "React Router — Context, Middleware & Server Boundary",
  "q": "In a framework where parent and child route loaders run in parallel (not sequentially), a shared piece of request-scoped data (like the current user) is computed once in middleware and read from a request context in every loader that needs it, rather than each loader independently re-fetching it. Why does this matter specifically because loaders run in parallel?",
  "a": "<span class='core'><b>The Core Rule:</b> When loaders run in parallel, nothing coordinates them by default — if the same input is needed by three loaders in the same tree and each fetches it independently, you get three duplicate calls purely from lack of coordination.</span>Populating a request-scoped context in middleware — which runs before any loader in the tree — lets every loader read the <i>same already-resolved</i> data, turning an O(n) fan-out of redundant identical calls into one shared computation per request. It's functionally a per-request cache, correctly scoped to the request lifetime rather than leaking across requests like a module-level singleton would."
 },
 {
  "cat": "React Router — Context, Middleware & Server Boundary",
  "q": "Authentication is enforced once, in middleware that runs before an entire route subtree, rather than as the first line of every loader underneath it. What does running it as middleware get you that a per-loader check wouldn't?",
  "a": "<span class='core'><b>The Core Rule:</b> A cross-cutting concern that applies to an entire subtree should be expressed once, at the root of that subtree — not repeated, and potentially forgotten, in every leaf underneath it.</span>Middleware runs before the entire loader tree is invoked for every nested route under it, so the check guarantees no descendant loader can ever execute unauthenticated, without each loader remembering to repeat it. Duplicating the check per-loader is repetitive and fragile: a new route added under the subtree that forgets to copy the check silently becomes unauthenticated."
 },
 {
  "cat": "React Router — Context, Middleware & Server Boundary",
  "q": "An app has both a server-side request context (populated during the loader phase) and a client-side 'outlet context' (passed down through a layout's rendered output to child routes). Given both exist, why use two different context mechanisms instead of one?",
  "a": "<span class='core'><b>The Core Rule:</b> A loader-phase context and a render-phase context solve different lifecycle problems — one exists only on the server before any component renders, the other only once the component tree is actually mounted — so neither substitutes for the other.</span>The server-side context exists only during the loader/middleware phase — it's the mechanism for sharing data <i>between loaders</i> in one request, not a construct usable inside JSX. The client-side outlet context is the render-time equivalent, letting a parent route component hand renderer-only data down to whatever child renders inside it without every intermediate layout forwarding props explicitly."
 },
 {
  "cat": "React Router — Context, Middleware & Server Boundary",
  "q": "In one part of an app, a data-loading function returns a discriminated status union (<code>{ status: 'ok' | 'not-found' | ... }</code>) on failure. In another part, a similar failure is handled by throwing, letting an error boundary catch it. What principle decides which approach to use where?",
  "a": "<span class='core'><b>The Core Rule:</b> Throw when a failure means the whole subtree can't meaningfully render; return a status union when the failure is local to one region of an otherwise-fine page.</span>Throwing is right when a failure means the entire route/subtree can't meaningfully render — an error boundary replaces the whole route UI, correct for something like 'you're not authenticated.' A status union is right when the failure is local to one panel — one widget failing to load shouldn't take down the rest of the page. The cost of the union approach: every consumer must remember to branch on status, whereas throwing is a pit of success — you can't forget, because unhandled errors propagate automatically."
 },
 {
  "cat": "React Router — Context, Middleware & Server Boundary",
  "q": "A meta-framework enforces a build-time naming convention (like a <code>.server.ts</code> suffix) that determines whether a module's code is allowed to reach the client bundle at all. What actually enforces that boundary, and what's the real consequence if server-only code — say, a function that signs internal auth tokens with a secret key — leaked into the client bundle?",
  "a": "<span class='core'><b>The Core Rule:</b> A build-time convention that tree-shakes server-only code out of the client bundle is a compiler-enforced secrets boundary, not just a naming convention — treat it as seriously as a compile error for exposing a secret.</span>The convention is statically recognized by the build tooling — code reachable only from server-only modules is tree-shaken out of the client bundle, and importing a server export from client code is a build-time error, not a silent runtime leak. If that boundary didn't exist, a signing secret used to mint service-to-service auth tokens would ship inside a JS bundle any user could inspect, letting anyone mint a valid token and impersonate the service to downstream APIs."
 },
 {
  "cat": "React Router — Context, Middleware & Server Boundary",
  "q": "An app has a helper that decides whether a given path should trigger a full-page navigation versus the framework's client-side router navigation, based on whether the path belongs to a <i>different</i> application entirely, served via server/CDN rewrites. Why can't the client-side router just handle every path uniformly?",
  "a": "<span class='core'><b>The Core Rule:</b> A client-side router can only navigate between routes it knows about; asking it to handle a path owned by a different application it has no bundle for either fails silently or does nothing — that boundary has to be crossed with a full page load, not client-side routing.</span>Those paths aren't part of this app's own router — they're routes owned by a separate application, reached via server/CDN rewrites. <code>navigate()</code> only knows routes registered in this app's own route table; asking it to navigate to a path it has no route for either 404s inside this SPA or does nothing, since no bundle for the other app is loaded into this runtime. Forcing a full page navigation hands the request back to the actual routing layer, which serves the other application's bundle — a classic micro-frontend seam, and a common bug once one app splits into several."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "After writing a value directly to a cookie via the browser's cookie API (not through a form/fetcher submission), a component immediately calls <code>revalidator.revalidate()</code>. Given this framework automatically re-runs loaders after a fetcher/form submission completes, why is a manual revalidate call necessary here?",
  "a": "<span class='core'><b>The Core Rule:</b> Automatic revalidation is wired to the router's own mutation primitives — a submission it knows about. A side effect that changes server-relevant state through a channel the router didn't initiate (a raw cookie write, a direct API call) is invisible to it, so nothing triggers a refetch unless you ask for one explicitly.</span>Automatic revalidation fires specifically after a <code>fetcher.submit</code>/<code>&lt;Form&gt;</code> action completes, because the router itself initiated and tracked that mutation. Writing to <code>document.cookie</code> directly changes state the next loader run would read differently, but it didn't happen through any router-tracked mutation, so the router has no way to know a revalidation is warranted. <code>revalidator.revalidate()</code> is the escape hatch for exactly this case: 'I changed something loaders depend on, through a channel you don't track — please re-run them.'"
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "A component derives its pending/busy state from <code>fetcher.state !== 'idle'</code> rather than a route-level navigation state hook. What's the actual scoping difference between a fetcher's own state and the router's global navigation state, and why does it matter for a component embedded deep inside a shared page?",
  "a": "<span class='core'><b>The Core Rule:</b> Global navigation state answers 'is the router doing anything, anywhere in the app right now?' A fetcher's own state answers 'is *this specific* submission I own still in flight?' — conflating them makes one component's mutation appear to affect every other component's loading indicator.</span>If a deeply-nested component used a global navigation state hook to derive its own pending UI, it would show as 'busy' any time <i>any</i> navigation or submission happened anywhere in the app — including ones it has nothing to do with — flashing a spinner on an unrelated widget every time the user clicks a link elsewhere on the page. A fetcher's <code>state</code> is scoped to that one fetcher instance's own submission lifecycle, so a component only shows pending UI for the mutation it actually initiated, which is what you want for any component embedded in a page with other independent async work happening around it."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "A hook calls <code>useMatches()</code> and searches the returned array for a specific ancestor route by its route <code>id</code> to read that route's loader data, rather than the data being passed down as an explicit prop through every intermediate layout. What problem does this solve, and what's the coupling cost?",
  "a": "<span class='core'><b>The Core Rule:</b> Reading ancestor loader data via <code>useMatches()</code> avoids prop-drilling it through every layout in between — at the cost of the reading component now being implicitly coupled to that ancestor route's exact string id and loader return shape, a dependency the type system won't catch if either changes.</span>Without it, a value computed once in a top-level layout's loader would need to be threaded as a prop through every intermediate layout component between it and the component that actually needs it, even ones with no other reason to know about that data. <code>useMatches()</code> lets a deeply-nested component reach directly into a specific ancestor's loader data by id, skipping the prop-drilling — but that convenience is a form of coupling: the route id is just a string, so renaming the ancestor route, or changing what its loader returns, breaks this consumer silently rather than via a compiler error, unlike an explicitly-typed prop chain would."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "A route configuration registers the same page component under three separate entries — an index route, a static path, and a path with a dynamic segment — each given a distinct route <code>id</code>. Why register one component three times instead of a single route with an optional parameter?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Registering the same component under multiple explicit route entries costs some repetition, but buys each entry its own stable, addressable identity — usable for <code>useMatches()</code> lookups, per-entry metadata, or future divergence — that a single route with an ambiguous optional parameter wouldn't cleanly provide.</span>A single route with an optional parameter conflates three conceptually different navigational states (default landing, explicit list view, specific-item view) into one loader that has to branch internally on whether the param is present, and gives all three exactly one shared route id — which breaks any code that needs to distinguish, say, 'the index view' from 'a specific detail view' by id (for <code>useMatches()</code>, breadcrumbs, or analytics). Explicit separate entries cost a little config repetition but keep each navigational state independently addressable and let any one of them diverge in behavior later without disturbing the others."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "A route module exports only a <code>loader</code> that returns <code>Response.json(...)</code>, with no default component. What is a route like this actually for within an otherwise page-rendering app, and why colocate it in the same route tree as page routes instead of standing up a separate backend endpoint?",
  "a": "<span class='core'><b>The Core Rule:</b> A component-less route is a resource route — a plain JSON endpoint that happens to live inside the same routing tree as your pages, giving it the same middleware, auth context, and request-scoped data every page route gets, for free.</span>Because it's still a route in the same tree, it runs through the same middleware chain (so authentication/authorization is enforced identically to a page route, with zero duplicated logic) and can read the same request context that page loaders populate — useful when the endpoint exists specifically to serve client-side <code>fetch</code> calls from within the already-authenticated app (a backend-for-frontend style pattern), rather than being a public API that would need its own independent auth story if it lived in a separate service."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "Loader and component function signatures are typed via a framework-generated <code>Route.LoaderArgs</code>/<code>Route.ComponentProps</code> imported from a generated <code>+types</code> module, rather than manually parameterizing a generic like <code>LoaderFunctionArgs&lt;Params&gt;</code> by hand. What does the generated, per-route type give you that a manually-authored generic type wouldn't?",
  "a": "<span class='core'><b>The Core Rule:</b> A generated per-route type is derived from the actual route tree — its literal path segments and its own loader's actual return type — so it can't drift from reality the way a hand-maintained generic parameter can; renaming a dynamic segment or changing a loader's return shape is caught immediately, everywhere.</span>A hand-authored generic type for route params has to be kept in sync manually with the literal path string defined elsewhere in the route config — nothing stops the two from silently diverging. A generated type is produced directly from the route tree itself, so <code>params</code> knows exactly which dynamic segments exist for that specific route entry, and <code>loaderData</code> in the component's props is inferred directly from what that route's own loader actually returns — changing either the route path or the loader's return shape immediately and correctly updates the generated type everywhere it's consumed, the same 'derive, don't duplicate' principle applied to routing instead of to a client factory or a validation schema."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "A streamed <code>&lt;Await&gt;</code> boundary is given its own <code>errorElement</code>, separate from the route's top-level error boundary. Why maintain two different error-handling layers for what is, underneath, the same loader's data?",
  "a": "<span class='core'><b>The Core Rule:</b> A route-level error boundary catches failures that happen before the page has committed anything to the screen; a streamed promise can reject <i>after</i> the page has already rendered successfully, and by then the route boundary isn't the right place to catch it — the failure needs to be scoped to just the slice of UI that was waiting on it.</span>The route's top-level error boundary catches errors thrown synchronously during loader execution, or during the initial render — appropriate for 'nothing on this page can be trusted.' A promise passed un-awaited into <code>&lt;Await&gt;</code> can reject well after the surrounding page has already rendered and committed successfully; if that rejection propagated all the way up to the route boundary, it would tear down an already-working page over the failure of one streamed section. Giving <code>&lt;Await&gt;</code> its own <code>errorElement</code> scopes the failure to exactly the region that was waiting on that specific promise, leaving everything else on the page untouched."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "A loader does <code>throw redirect('/dashboard')</code> rather than <code>return redirect('/dashboard')</code>, even though both abort the loader and issue the same redirect response. Why throw?",
  "a": "<span class='core'><b>The Core Rule:</b> Returning a redirect only works cleanly when the decision is the very last thing the loader's own top-level function body does; throwing lets the redirect short-circuit from any depth — inside a helper function, partway through a conditional — without every calling frame needing to explicitly propagate a special return value back up.</span>If the redirect decision is made inside a helper function called by the loader, or partway through a chain of conditionals, returning it would require every intermediate frame to check for and re-return that special value up the call stack manually. Throwing behaves like an early-exit exception — it unwinds directly to the framework's own handling of thrown responses/redirects, regardless of how deep in the call stack the decision was made, the same reasoning that motivates using exceptions generally for control flow that needs to unwind multiple stack frames at once rather than being threaded through every return value in between."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "A server entry point manually constructs the framework's own request handler and invokes it with a freshly-created context provider on every request, rather than relying on the framework's default request-handling wiring. Under what circumstance would a team deliberately own this integration point instead of using the default setup, and what's the cost of doing so?",
  "a": "<span class='core'><b>The Core Trade-off:</b> Owning the framework's own entry point is justified when a still-stabilizing framework feature isn't yet compatible with your specific hosting platform and you can't wait for upstream support — but it means you now own an integration point that has to be kept in sync with the framework's internal expectations across every future upgrade.</span>This is usually a workaround for a genuine incompatibility between a newer framework feature (often something still behind a flag) and a specific hosting platform's request-handling model, where waiting for upstream compatibility isn't an option. The team accepts the maintenance cost of hand-wiring the request handler and context provider themselves — an integration point that must be manually revisited on every framework upgrade, since the framework's internal expectations about how that wiring works can change — in exchange for shipping now instead of blocking on an external fix."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "An anonymous identifier used purely for feature-flag targeting is stored via a full cookie-session-storage abstraction (get/commit/destroy) rather than reading and writing a raw cookie value directly. What does the session-storage abstraction buy over hand-rolling cookie parsing for a single opaque value?",
  "a": "<span class='core'><b>The Core Rule:</b> A framework's session-storage abstraction bundles serialization, tamper-resistant signing, and a consistent get/commit/destroy lifecycle — hand-rolling raw cookie reads/writes for a single value means either re-implementing that protection ad hoc or silently shipping without it.</span>Session storage handles serialization and signs the cookie payload to prevent client-side tampering, and gives a uniform lifecycle (get, commit, destroy) that composes consistently with the rest of the framework's cookie handling — secure flags, expiry, and so on. Hand-rolling raw cookie reads/writes for something like an anonymous fingerprint would either skip that tamper protection entirely or duplicate it ad hoc per call site; session storage is the framework's blessed abstraction for exactly this 'small opaque value that must survive across requests and shouldn't be forgeable or malleable by the client' use case."
 },
 {
  "cat": "React Router — Data Loading, Routing & Resource Routes",
  "q": "A cookie used to hold local, non-production testing/simulation state is explicitly created with <code>httpOnly: false</code>, while the app's real authentication-token cookies are httpOnly. Why deliberately weaken this one cookie's protection instead of applying the same httpOnly default everywhere?",
  "a": "<span class='core'><b>The Core Rule:</b> <code>httpOnly</code> is a security property that should be applied based on what a specific cookie actually protects, not blanket-applied to every cookie in an app — a cookie carrying no real credential, that a client-side control needs to update instantly without a server round-trip, has a legitimate reason to stay JS-writable.</span><code>httpOnly</code> prevents JavaScript from reading or writing a cookie, the correct default for anything carrying real credentials, since it mitigates token theft via a script-injection vulnerability — but it also means only the server can set that cookie, requiring a full round-trip through a loader/action to change it. A cookie that exists purely to let a client-side dev/test control update its own value immediately, without waiting on a server round-trip before the next revalidation, needs to be writable from JS to function at all — applying httpOnly there wouldn't add meaningful protection (there's no real credential to steal) and would just break the feature it exists for."
 },
 {
  "cat": "TypeScript Type System",
  "q": "An API result type is modeled as a discriminated union — <code>{ success: true; data: T } | { success: false; error: E }</code> — rather than one type with independently-optional <code>data</code>/<code>error</code> fields. What does a true discriminated union get you that the independently-optional version doesn't?",
  "a": "<span class='core'><b>The Core Rule:</b> A discriminated union makes illegal states unrepresentable; independently-optional fields only make them unlikely — and 'unlikely' still compiles.</span>Once you check <code>if (result.success)</code> via a type guard, TypeScript narrows the type in that branch — <code>data</code> is known to exist and <code>error</code> known to be undefined, no optional-chaining required. With independently-optional fields, the compiler can't rule out (or prevent constructing) the nonsensical state of both being present or both absent — every consumer has to defensively check both."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A codebase defines a branded/nominal type for a specific kind of identifier — e.g. <code>type OrderId = string & { __brand: 'OrderId' }</code> — even though TypeScript's structural typing means this doesn't add a real runtime guarantee. What is a branded type actually buying you?",
  "a": "<span class='core'><b>The Core Rule:</b> A branded type is documentation-as-types, not runtime validation — it stops the compiler from accepting any string where a specific kind of string was intended, but the real guarantee still has to come from validating at the boundary where the branded value is constructed.</span>It buys resistance to primitive obsession: without a distinct type, any bare string could be passed anywhere the specific identifier is expected, and the compiler would accept it silently. A dedicated (even imperfectly-enforced) type documents intent in a function signature and nudges callers to cast explicitly right where real runtime validation happens — after a regex/format check, say — rather than letting an unrelated string slip through undetected."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A codebase types a family of string constants with a template literal type — e.g. <code>type Scope = `app:${string}`</code> — and declares the lookup table with <code>as const satisfies Record&lt;Role, readonly Scope[]&gt;</code>. What does each piece independently guarantee?",
  "a": "<span class='core'><b>The Core Rule:</b> Template literal types catch shape typos at compile time that plain <code>string</code> can't; <code>as const</code> preserves literal narrowing; <code>satisfies</code> verifies completeness without widening the inferred type — three independent guarantees, easy to conflate as one.</span>The template literal type rejects any value that doesn't match the required prefix at compile time — a typo fails to compile, where plain <code>string</code> would accept it silently. <code>as const</code> keeps every array/string at its narrowest literal type, so later <code>.includes()</code> checks compare literal unions, not widened <code>string[]</code>. <code>satisfies</code> verifies the object has an entry for every required key <i>without</i> widening the object's inferred type down to the <code>Record</code> shape."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A codebase defines a runtime validation schema (e.g. with Zod) first, and derives the TypeScript type from it with <code>z.infer</code>, rather than hand-writing an interface and a separate validator function. What bug class does schema-first modeling eliminate that hand-written interfaces plus a separate validator cannot?",
  "a": "<span class='core'><b>The Core Rule:</b> Whenever a static type and a runtime validator describe the same shape but are maintained as two separate artifacts, they will eventually drift apart — deriving one from the other makes drift structurally impossible.</span>When interface and validator are written independently, someone adds a field to the interface and forgets the schema (or vice versa), so parsing either rejects valid data or, worse, succeeds while returning an object whose type promises a field that was never actually validated. Deriving the type from the schema means any schema change immediately and correctly changes the type everywhere it's used, and the compiler catches every downstream break."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A validation schema uses <code>.transform()</code> to convert a raw wire value (like an epoch timestamp) into a cleaner domain shape (an ISO string), and <code>.preprocess()</code> to paper over an upstream API that sometimes omits a field that should default to an empty array. Why normalize inside the schema rather than in a separate mapping function called after validation?",
  "a": "<span class='core'><b>The Core Rule:</b> Normalizing inside the schema means the type returned by validation already reflects the normalized shape, so it's structurally impossible for downstream code to accidentally see the raw, un-normalized value.</span>A timestamp field ends up typed as the ISO string it will actually be, not the raw epoch number the wire sends — nothing downstream can accidentally treat it as a number, and no one has to remember 'always call normalize() after parsing.' <code>preprocess</code> specifically fixes data <i>before</i> validation runs, defending against a contract violation without loosening the schema and pushing null-checks onto every consumer."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A validation schema is written as a <code>z.union</code> of three structurally different response shapes, each with its own <code>.transform()</code> into a common output — because three upstream endpoints return the same conceptual data in three different envelopes. What's the alternative without a union type, and why is it worse?",
  "a": "<span class='core'><b>The Core Rule:</b> Without a union validator, you either sniff the shape manually against unvalidated data before validation runs, or loosen the schema so much it stops catching genuinely malformed input — a union lets you validate and normalize atomically.</span>A union tries each member schema in order and returns the first match, so validation and shape-normalization happen together; a genuinely unexpected fourth shape correctly fails validation instead of silently returning a partially-wrong object built from ad-hoc shape-sniffing done against data nothing has verified yet."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A codebase defines standalone predicate functions with the <code>(x): x is T</code> return-type annotation, rather than inlining the equivalent boolean check wherever it's needed. Why does the standalone type-guard function matter, beyond just being reusable?",
  "a": "<span class='core'><b>The Core Rule:</b> A function returning <code>x is T</code> doesn't just return a boolean — it teaches the compiler to narrow the checked value's type at every call site, including inside <code>.filter()</code>. An inline boolean check narrows too, but only locally, and duplicates the type's defining condition everywhere it's checked.</span>That's why <code>items.filter(isValidItem)</code> returns a correctly-narrowed array, not the original union type — <code>Array.prototype.filter</code> has an overload specifically recognizing predicate callbacks. Inlining the check would duplicate the exact definition of 'is a T' at every call site instead of centralizing it for a future change."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A shared data-loading function is generic over a metric type — <code>function load&lt;M extends Metric&gt;(metric: M, fieldMap: Record&lt;M, Field&gt;)</code> — called from two different wrapper functions each passing a different, narrower metric union. Why generic instead of just typing the parameter as the full union directly?",
  "a": "<span class='core'><b>The Core Rule:</b> Typing a shared function against the full union lets any caller mix-and-match members from different sub-families that were never meant to cross; making it generic over an inferred, narrower type parameter lets the compiler catch that mismatch per call site.</span>Making the function generic and constraining the type parameter lets each concrete call site <i>infer</i> its own narrower type from the arguments actually passed, and the compiler then enforces that the metric and its field map agree for that specific call — turning a runtime 'field is undefined' bug into a compile-time type error."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A shared client/service type is defined as <code>ReturnType&lt;typeof createClient&gt;</code> instead of a hand-written interface listing every method the factory function returns. What failure mode does this avoid?",
  "a": "<span class='core'><b>The Core Rule:</b> Any type that's a manual restatement of an implementation's shape will eventually drift from that implementation; deriving the type from the implementation instead makes drift mechanically impossible.</span>A hand-written interface needs manual upkeep every time a method is added, renamed, or a signature changes — classic duplication drift where the interface silently becomes too permissive or too restrictive, uncaught because it's asserted, not derived. Deriving it from the factory function's actual return type makes the type a live projection of the implementation."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A set of data-fetching functions is written as curried factories — <code>(client) => async (id) => ...</code> — rather than each function constructing its own client internally, and they're assembled into one repository object by a top-level factory. What does injecting the client this way buy over each function building its own dependency internally?",
  "a": "<span class='core'><b>The Core Rule:</b> A function that constructs its own dependencies internally is untestable in isolation; a function that receives them as parameters can be tested with a fake, with zero mocking-library machinery.</span>Taking the client as a parameter means these functions have no hidden dependency on base URLs, headers, or auth — a unit test can pass a hand-built fake client and exercise the aggregation logic completely offline. This is dependency injection via closures — the same testability/decoupling benefit as a class with a constructor, without the ceremony."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A validation schema uses <code>.refine()</code> to enforce a rule spanning two fields (both must be present together, or absent together) or a rule about how elements of an array interact with each other. Why can't ordinary field-level validators express these constraints?",
  "a": "<span class='core'><b>The Core Rule:</b> Field-level validators only ever see one field in isolation; any rule that's actually a relationship <i>between</i> fields, or between array elements, has to be expressed at the object level, after individual fields have already validated.</span>A whole-object refinement runs after field-level validation succeeds and receives the entire parsed object, making it the correct place for cross-field business rules — like a database check constraint versus a column type constraint. Without it, the fields would have to go fully optional and the real rule would land in ad-hoc post-parse code."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A custom hook derives a value from shared external state in two chained <code>useMemo</code> calls — one computing an intermediate array, a second picking one element from it — instead of one combined memo doing both steps. Why split the derivation into two memoized stages?",
  "a": "<span class='core'><b>The Core Rule:</b> Chaining memos so each depends only on the output of the previous one lets each stage recompute independently of the others — collapsing them into one memo re-couples their invalidation even when only one input actually changed.</span>The first memo recomputes only when the raw source's identity changes, producing an intermediate value; the second depends only on that intermediate value. If the raw source were referentially unstable across renders that don't really change anything meaningful, but the intermediate value's content stayed the same, one combined memo would force a full recompute regardless — two separately-keyed memos keep each transformation individually stable and testable."
 },
 {
  "cat": "TypeScript Type System",
  "q": "A loader field that's normally a resolved-or-pending promise is set to <code>Promise.reject(new Error('no-location'))</code> rather than <code>undefined</code> or a resolved fallback value, specifically to keep that field's type as a <code>Promise</code> in every code path, not just the happy one. Why deliberately construct a rejected promise instead of just omitting or defaulting the value?",
  "a": "<span class='core'><b>The Core Rule:</b> When a value is always going to be consumed through one uniform async-handling mechanism (like a Suspense/Await boundary), keeping its type unconditionally a <code>Promise</code> — even a deliberately pre-rejected one — lets every 'no data' scenario, whatever the actual cause, flow through that same single error-handling path instead of needing its own special-cased branch.</span>Downstream, this field is always fed into a component that expects a <code>Promise</code>; if the field were sometimes a plain value and sometimes a <code>Promise</code> depending on some precondition, every consumer would need to type-check or branch before rendering, defeating the point of a uniform async interface. Keeping the type a <code>Promise</code> unconditionally lets the exact same error-handling path used for 'the API call failed' also handle 'we never had a valid precondition to call the API with' — collapsing two different reasons for missing data into one code path instead of two."
 },
 {
  "cat": "TypeScript Type System",
  "q": "Several loader result types each add their own extra, domain-specific status value (like <code>'no-location'</code>) that doesn't exist in a shared status union used elsewhere in the app, rather than adding that value to the shared union and reusing it everywhere. Why not just extend the shared union once instead of defining a new, narrower union per use case?",
  "a": "<span class='core'><b>The Core Rule:</b> A status value that represents a precondition failure specific to one family of consumers doesn't belong in a status union shared by consumers that can never actually hit that precondition — adding it there would force every unrelated consumer to account for a case that, for them, is genuinely impossible, weakening the exhaustiveness check a discriminated union is supposed to provide.</span>A status like 'no-location' isn't a failure mode of the underlying operation itself — it means 'we never attempted the operation because a precondition wasn't met,' which is only meaningful to consumers that actually depend on that precondition. Adding it to a shared union used broadly would force every consumer — including ones that never depend on that precondition — to handle a branch that can't occur for them. Defining a narrower, purpose-built union per use case keeps each union's cases exactly as broad as what can actually happen in that specific context, which is what makes exhaustiveness checking useful rather than a formality."
 },
 {
  "cat": "API & Resilience Patterns",
  "q": "A function fetches two related resources with <code>Promise.allSettled</code> and inspects each result independently to decide what to re-throw, while a different function fetches five independent resources with a plain <code>Promise.all</code>. Why the different choice, and what breaks if they're swapped?",
  "a": "<span class='core'><b>The Core Rule:</b> Use <code>Promise.all</code> when a partial result is meaningless and the whole operation should fail together; use <code>allSettled</code> when you need to distinguish which specific dependency failed, to react to each one differently.</span><code>Promise.all</code> rejects as a whole the instant any input rejects — right when several results are combined into one unified output and a partial result would silently misrepresent the whole. <code>allSettled</code> lets a caller distinguish which call failed — say, one dependency should abort everything as a prerequisite, while another's failure alone should be tolerated — information <code>Promise.all</code>'s single rejection discards."
 },
 {
  "cat": "API & Resilience Patterns",
  "q": "A function that dedupes concurrent identical requests caches the <i>pending promise itself</i> in a Map, keyed by some identity value, rather than caching the resolved result after awaiting it. Why cache the promise instead of the resolved value?",
  "a": "<span class='core'><b>The Core Rule:</b> Caching only the resolved value misses the exact race it's meant to prevent — two concurrent callers who both check the cache before either has finished will both find it empty and both fire a duplicate request. Caching the in-flight promise synchronously closes that window.</span>Storing the in-flight promise before any <code>await</code> means a second concurrent caller retrieves and awaits the <i>same</i> promise the first is already waiting on, so only one request ever fires — the same request-deduplication technique used internally by libraries like React Query and SWR, implementable by hand with a plain Map."
 },
 {
  "cat": "API & Resilience Patterns",
  "q": "A function that loads and categorizes a primary resource treats one dependency as fatal to the whole operation, but treats a second, related dependency as optional — its failure just falls back to an empty result and a less-precise categorization. Why is one dependency required and the other optional, even from the same API family?",
  "a": "<span class='core'><b>The Core Rule:</b> 'Does the failure make the output meaningless, or just less precise?' is the actual question — not 'did the call fail.' Every dependency deserves that judgment call made explicitly, rather than one blanket try/catch policy for everything.</span>The required dependency defines the entire universe of what can be shown — without it there's nothing to render. The optional dependency only refines how that already-known set is categorized; failing there still lets the operation return something true and useful, just less precisely categorized — strictly better than failing the whole operation over one secondary signal."
 },
 {
  "cat": "API & Resilience Patterns",
  "q": "A storage layer splits an oversized value across multiple smaller storage slots because a single slot has a hard size limit, and on read explicitly checks that all expected slot indexes are present and sequential before reassembling them. What correctness hazard does that sequential-index check guard against, beyond just handling the size limit?",
  "a": "<span class='core'><b>The Core Rule:</b> Splitting data to route around a size limit solves the write side; verifying the chunks are complete and contiguous before reassembling solves the read side — without that check, a partially-evicted chunk set silently reassembles into corrupted data that still looks parseable.</span>If one middle chunk was evicted while others survive, naively joining whatever chunks <i>are</i> present in index order would silently reassemble corrupted/truncated data. Requiring the indexes to be exactly sequential with no gaps forces a hard failure instead of quietly returning wrong data."
 },
 {
  "cat": "API & Resilience Patterns",
  "q": "A codebase hardcodes a full fallback value for every single feature flag, curated individually per flag, rather than relying on the flag SDK's own generic defaults. What failure mode does a hand-curated fallback table protect against that generic SDK defaults wouldn't?",
  "a": "<span class='core'><b>The Core Rule:</b> A third-party SDK's generic default (usually 'off' or undefined) is a safe default for that SDK, not necessarily for your product — a hand-curated fallback lets each flag degrade to the behavior the app actually wants during an outage, not just 'nothing.'</span>If the flag service's client fails to initialize or is unreachable, every flag evaluation would otherwise resolve to undefined/false for everything — for a flag gating which entire experience renders, that could silently break the interface. A hand-curated table hardcodes what each flag should be during a total outage, per-flag, so an outage degrades the app to 'behaves like before this flag existed' instead of an undefined state — a circuit-breaker fallback applied to feature flags."
 },
 {
  "cat": "API & Resilience Patterns",
  "q": "A custom hook wraps a feature-flag SDK's raw output, normalizing every flag — which can be a plain boolean or a more complex targeting object — into a uniform boolean map, and memoizes the result, rather than every consumer calling the raw SDK hook and inlining the normalization itself.",
  "a": "<span class='core'><b>The Core Rule:</b> Whenever multiple consumers need the same transformation of shared data, centralize it once instead of duplicating it at every call site — duplication means every future change to the transformation has to be found and fixed everywhere it was copied.</span>Every consumer needing a plain boolean would otherwise need to know some flags are simple booleans and others are complex objects, duplicating identical normalization logic at each call site. Centralizing it means every consumer gets a uniform shape regardless of underlying representation, and memoizing avoids re-running that normalization on every render of components that render frequently."
 },
 {
  "cat": "API & Resilience Patterns",
  "q": "A data-fetching function deliberately widens its request window by one extra day beyond what's logically needed, then relies on a later in-memory filter to prune the extra results, rather than trying to compute the exact correct window up front. Why over-fetch and filter, instead of getting the window exactly right?",
  "a": "<span class='core'><b>The Core Rule:</b> When an upstream API's semantics don't perfectly match what you need — a date filter that's timezone-naive, say — it's often more robust to over-fetch against the API's loose guarantee and filter precisely with logic you fully control, than to reverse-engineer the exact boundary the API expects.</span>The real constraint is usually that the upstream endpoint's date parameter is imprecise in a way that could miss data at the edge of the window if the exact boundary were computed and trusted. Padding the request window and pruning client-side with logic that has full information guarantees correctness by trading a slightly wasteful over-fetch for not depending on an upstream API's semantics being exactly right."
 },
 {
  "cat": "Security & Platform Engineering",
  "q": "A post-login redirect helper rejects a target path unless it starts with a single <code>/</code>, explicitly also rejecting paths starting with <code>//</code>. Why is a double-slash path dangerous, given it does technically start with a <code>/</code>?",
  "a": "<span class='core'><b>The Core Rule:</b> Any user-controllable value that becomes a redirect target needs its own dedicated validation — 'starts with a slash' is not sufficient, because <code>//</code> is browser-parsed as a protocol-relative URL, not a same-origin path.</span>A naive <code>path.startsWith('/')</code> check alone would let an attacker craft a login link with a return-path parameter that, after successful authentication, silently redirects the browser to an attacker-controlled origin — an open-redirect vulnerability, dangerous specifically because the initial URL points at your real, trusted login domain. The return path is typically read straight from a query parameter on an incoming request, so it's always attacker-controllable."
 },
 {
  "cat": "Security & Platform Engineering",
  "q": "A function that mints a service-to-service auth token signs a brand-new JWT with a short expiration (a few minutes) on essentially every call, rather than minting one long-lived token once and reusing it. What's the security rationale, and what would caching the token trade away?",
  "a": "<span class='core'><b>The Core Rule:</b> Short-lived credentials bound the blast radius of a leak to their lifetime; re-signing is usually cheap (HMAC signing is trivial), so there's rarely a real performance reason to trade that safety property away for caching.</span>A short-lived, freshly-minted token bounds a leak to a short window — if it's ever logged or intercepted, it self-invalidates almost immediately. The actual secret being protected is the signing key itself, which never leaves the server; caching would only add attack surface (a longer-lived bearer credential sitting in memory) for no real benefit."
 },
 {
  "cat": "Security & Platform Engineering",
  "q": "An authorization check doesn't check for specific role names directly — it iterates every role the current user holds and checks whether <i>any</i> of their roles' permission tables include the requested permission. Why not just check <code>if (user.hasRole('admin') || user.hasRole('manager'))</code> at each call site that needs a given permission?",
  "a": "<span class='core'><b>The Core Rule:</b> Checking for a capability (does the user have this permission, from any source) instead of enumerating identities (does the user hold any of these roles) means adding a new role that should grant an existing permission is a one-line change in one table, not a hunt through every call site.</span>Multiple different roles can each independently grant the same permission. Hardcoding the role list at every call site means each one independently enumerates every role granting it — and silently goes stale the moment a new role is added that should also grant it. Checking capability makes 'can this user do X' a pure function of one source of truth."
 },
 {
  "cat": "Security & Platform Engineering",
  "q": "A dev-only feature is disabled both at build time (excluded from production builds entirely) and at runtime (a request-origin/host check against known production domains). If the feature doesn't even exist in a production build, why also check at runtime?",
  "a": "<span class='core'><b>The Core Rule:</b> Defense in depth means each layer protects against a different failure mode of the layer before it — a build-time exclusion assumes the build classification is always correct; a runtime check catches the case where that assumption doesn't hold for a given deployed environment.</span>The build-time exclusion is primary: in a normal production build, the feature's code simply doesn't exist. But the runtime check is also invoked from shared code paths that run in every environment, including non-production environments where the feature is compiled in — so a request arriving with a production-looking origin, perhaps via a misconfigured proxy, is still refused."
 },
 {
  "cat": "Auth, Sessions & Identity Architecture",
  "q": "A single-page app uses the OAuth Authorization Code flow with PKCE for login rather than the older Implicit flow, even though both eventually get the SPA an access token. What specific vulnerability does PKCE close that the Implicit flow left open, and why can't a public client (a SPA with no backend secret) just use a client secret instead?",
  "a": "<span class='core'><b>The Core Rule:</b> The Implicit flow returns tokens directly in the browser's URL fragment, exposed to anything running on the page and to browser history; PKCE lets a public client prove it's the party that started the flow — without ever holding a secret it could leak — by presenting a value at token-exchange time that must match a hash it generated and kept private at flow start.</span>A confidential client (a real backend) can prove its identity with a client secret because it can actually keep that secret safe; a SPA can't — any secret embedded in JS shipped to the browser is not a secret. The Implicit flow avoided needing one by returning tokens straight in the URL fragment, but that exposes tokens to anything with access to the browser (malicious extensions, referrer leaks, history) and to interception of the redirect. PKCE instead has the client generate a random verifier, send only its hash at authorization start, and later present the original verifier when exchanging the authorization code for tokens — an attacker who intercepts the code in transit still can't redeem it without also having the verifier, which never left the legitimate client."
 },
 {
  "cat": "Auth, Sessions & Identity Architecture",
  "q": "A system uses three different credential types for roughly the same purpose — a short-lived access token, a longer-lived refresh token, and a session cookie — rather than just one long-lived credential covering everything. What does each one's specific lifetime and storage location protect against that a single credential wouldn't?",
  "a": "<span class='core'><b>The Core Rule:</b> Splitting credentials by lifetime and blast radius means a leak of the short-lived one is nearly harmless by the time it's exploited, while the longer-lived one is stored and transmitted more carefully — and made individually revocable — precisely because it's more dangerous if it leaks.</span>An access token is short-lived and sent on every API request, so it's the one most exposed to interception/logging — keeping its lifetime short bounds how long a leaked one is useful. A refresh token lives longer and is used rarely (only to mint new access tokens), so it's kept in more protected storage and can be individually revoked without invalidating an entire session. A session cookie ties a browser to server-side session state that can be invalidated instantly server-side (logout, force-revoke a compromised session) in a way a self-contained stateless JWT can't be until it naturally expires."
 },
 {
  "cat": "Auth, Sessions & Identity Architecture",
  "q": "Rather than a SPA directly holding and attaching an OAuth access token to every API call from the browser, a backend-for-frontend layer holds the token server-side and the browser only ever receives an httpOnly session cookie. What specific class of vulnerability does keeping the access token entirely out of the browser close off?",
  "a": "<span class='core'><b>The Core Rule:</b> An access token that never reaches client-side JavaScript can't be stolen by client-side JavaScript — the BFF pattern trades 'the SPA can call APIs directly' for 'a compromised script on the page still can't exfiltrate a usable API credential,' since there isn't one within reach.</span>If the access token lives in the browser, even in memory, a successful cross-site-scripting injection on that page can read and exfiltrate it, giving an attacker a working credential to call APIs as the user from anywhere, for as long as the token is valid. If the token is held server-side by a BFF, and the browser only carries an httpOnly session cookie JS can't read, an XSS bug can still ride the session to make requests through the BFF (mitigated separately with CSRF protections), but it can't steal a portable, replayable-elsewhere credential — there isn't one within reach of injected script."
 },
 {
  "cat": "Auth, Sessions & Identity Architecture",
  "q": "An app authenticated via a cookie automatically attached to every same-origin request needs explicit CSRF protection, while an app authenticated via a bearer token manually attached in an Authorization header generally doesn't. Why does the browser's own cookie-attachment behavior create this asymmetry?",
  "a": "<span class='core'><b>The Core Rule:</b> Browsers attach cookies to a request automatically based on the target origin, regardless of which site's page initiated the request — a malicious page on another origin can trigger a request to your API and the browser will still attach the session cookie, which is exactly what CSRF protection exists to close; a bearer token has no such automatic attachment, so a malicious page has no way to make the victim's browser include it.</span>A form or fetch call on an attacker's page targeting your API still carries the victim's real session cookie, letting the attacker perform actions as the logged-in user without ever seeing their credentials. Bearer-token auth requires the calling code to explicitly read the token and set it as a header — a page on a different origin has no access to that value and no way to force it into the request, so the same attack simply doesn't apply, though this trades away httpOnly protection against XSS-based token theft, which is why cookie auth and bearer-token auth need genuinely different mitigations rather than one being strictly safer than the other."
 },
 {
  "cat": "Auth, Sessions & Identity Architecture",
  "q": "A session cookie is set with <code>SameSite=Lax</code> rather than <code>SameSite=Strict</code> or no SameSite attribute at all. What specific cross-site request behavior does each of the three settings allow or block, and why is <code>Lax</code> usually the right default for a typical login session cookie rather than the stricter option?",
  "a": "<span class='core'><b>The Core Rule:</b> <code>Strict</code> blocks the cookie on every cross-site request including top-level navigation (breaking 'click a link, land already logged in'); <code>Lax</code> allows it on top-level cross-site navigations but blocks it on cross-site subresource requests and non-GET cross-site requests (closing most CSRF vectors); no attribute sends it everywhere, including the embedded cross-site requests that enable CSRF.</span>With no SameSite restriction, a cookie is attached to every request to its domain regardless of what site initiated it, including background requests from a malicious site — the core CSRF vulnerability. <code>Strict</code> closes that entirely but also breaks the common case of a user clicking a link from an external site and expecting to land already authenticated, since the cookie wouldn't be sent on that first cross-site navigation. <code>Lax</code> is the practical middle ground: it still sends the cookie on a top-level GET navigation while withholding it from the background/embedded cross-site requests CSRF attacks actually rely on."
 },
 {
  "cat": "Auth, Sessions & Identity Architecture",
  "q": "One approach to keeping a session alive is silently re-authenticating via a hidden iframe against the identity provider before the access token expires; another is exchanging a refresh token for a new access token directly. What browser-level restriction has made the hidden-iframe approach increasingly unreliable, and why does refresh-token rotation avoid that dependency?",
  "a": "<span class='core'><b>The Core Rule:</b> Silent re-auth via a hidden iframe depends on the identity provider's own session cookie being readable in a third-party (cross-site) context — browsers increasingly partition or block third-party cookies specifically to prevent cross-site tracking, which breaks this mechanism as collateral damage even though it wasn't the behavior being targeted; refresh-token rotation doesn't rely on any cross-site cookie at all.</span>The hidden-iframe approach loads the identity provider's domain in an invisible iframe, relying on the browser still recognizing the user's existing IdP session cookie inside that iframe to silently issue new tokens — structurally identical to how third-party tracking cookies work, so privacy features that block third-party cookies break it as a side effect. Refresh-token rotation sidesteps the problem: the refresh token is exchanged directly via an API call to the token endpoint, with no reliance on any cookie being visible in a cross-site iframe context, making it robust to browser privacy changes that specifically target third-party cookies."
 },
 {
  "cat": "Monorepo Architecture",
  "q": "A monorepo's build tool caches the output of a task (like build or test) keyed by a hash of the task's inputs, and skips re-running it entirely on a cache hit, including restoring from a remote cache on CI. What actually goes into that hash, and what happens if it's computed incorrectly — say, missing an input?",
  "a": "<span class='core'><b>The Core Rule:</b> A task cache is only as trustworthy as its input hash — if the hash misses something that actually affects the output (an unlisted environment variable, a file imported outside the declared dependency graph), the cache silently serves a stale result that looks like a correct build.</span>The hash is typically derived from the content of every file the task's package depends on — its own source plus the resolved dependency graph of internal workspace packages — along with the specific command and any declared environment variables affecting output. If something that actually influences the output isn't declared as an input, the cache key won't change when that thing does, and the tool will confidently replay a stale cached artifact instead of rebuilding — a correctness bug that's easy to miss because everything still 'passes.'"
 },
 {
  "cat": "Monorepo Architecture",
  "q": "A monorepo build pipeline config declares a task's dependency as <code>^build</code> rather than just <code>build</code>. What's the difference, and why does getting this wrong produce packages built against stale internal dependencies?",
